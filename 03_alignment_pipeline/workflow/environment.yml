name: metagenomic-alignment
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - snakemake-minimal>=7
  - bwa-mem2
  - samtools>=1.15
  - bedtools
  - r-base>=4.2
  - r-dplyr
  - r-readr
  - r-ggplot2
  - r-svglite
  # gawk, coreutils (comm, cut, sort), gzip are assumed to already be on the
  # system (standard on any Linux distro / WSL); not conda-managed here.
